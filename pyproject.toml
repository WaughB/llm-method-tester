[project]
name = "llm-method-tester"
version = "0.1.0"
description = "Benchmark LLM retrieval strategies (baseline, vector RAG, Obsidian RAG, PageIndex) across local Ollama models"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Brett Waugh" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "httpx>=0.28",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "chromadb>=0.6",
    "rank-bm25>=0.2.2",
    "typer>=0.15",
    "pyyaml>=6.0.3",
    # required by the vendored official PageIndex implementation
    "litellm>=1.84.0",
    "pypdf2>=3.0.1",
    "pymupdf>=1.26",
    "python-dotenv>=1.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.9",
]

[project.scripts]
llm-bench = "llm_bench.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_bench"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["src/llm_bench/_vendor"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "W"]

[tool.ruff.lint.per-file-ignores]
# typer's API is built on function calls in argument defaults
"src/llm_bench/cli.py" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live' --cov=llm_bench --cov-report=term-missing --cov-fail-under=80"
markers = ["live: tests that require a running Ollama server (excluded by default)"]

[tool.coverage.run]
source = ["src/llm_bench"]
omit = ["src/llm_bench/_vendor/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
