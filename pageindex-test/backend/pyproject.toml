[project]
name = "pageindex-test"
version = "0.1.0"
description = "Staged-retrieval prototype: hybrid recall + PageIndex precision over your own documents"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "llm-method-tester",
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "typer>=0.15",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2",
    "qdrant-client>=1.12",
    "python-multipart>=0.0.20",
    "httpx>=0.28",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.9",
]

[tool.uv.sources]
llm-method-tester = { path = "../..", editable = true }

[project.scripts]
pageindex-test = "pageindex_test.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pageindex_test"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "W"]

[tool.ruff.lint.per-file-ignores]
"src/pageindex_test/cli.py" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=pageindex_test --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
source = ["src/pageindex_test"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
