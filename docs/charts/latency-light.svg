<svg xmlns="http://www.w3.org/2000/svg" width="760" height="280" viewBox="0 0 760 280" role="img" aria-label="Latency per question">
<text x="0" y="18" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" fill="#0b0b0b">Latency per question</text>
<text x="0" y="36" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#52514e">Mean seconds per question across all three models (RTX 3080, includes all retrieval + generation calls).</text>
<text x="160" y="75.0" text-anchor="end" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#52514e">Baseline (control)</text>
<rect x="170" y="61.0" width="470.0" height="18" rx="3" fill="#b5b3ac"/>
<text x="648.0" y="75.0" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#0b0b0b">30.1s</text>
<text x="160" y="115.0" text-anchor="end" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#52514e">Vector RAG</text>
<rect x="170" y="101.0" width="34.4" height="18" rx="3" fill="#2a78d6"/>
<text x="212.4" y="115.0" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#0b0b0b">2.2s</text>
<text x="160" y="155.0" text-anchor="end" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#52514e">Obsidian RAG</text>
<rect x="170" y="141.0" width="43.7" height="18" rx="3" fill="#2a78d6"/>
<text x="221.7" y="155.0" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#0b0b0b">2.8s</text>
<text x="160" y="195.0" text-anchor="end" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#52514e">PageIndex (reimpl)</text>
<rect x="170" y="181.0" width="256.1" height="18" rx="3" fill="#2a78d6"/>
<text x="434.1" y="195.0" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#0b0b0b">16.4s</text>
<text x="160" y="235.0" text-anchor="end" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#52514e">PageIndex (official)</text>
<rect x="170" y="221.0" width="242.0" height="18" rx="3" fill="#2a78d6"/>
<text x="420.0" y="235.0" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#0b0b0b">15.5s</text>
<text x="0" y="272" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#898781">Baseline is slow because ungrounded models generate the most tokens when they know the least.</text>
</svg>